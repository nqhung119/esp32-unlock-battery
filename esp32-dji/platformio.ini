; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

; Default BMS wiring: SDA=GPIO21, SCL=GPIO22, I2C port 0.
; Override only after confirming your board wiring and safe 3.3-V logic levels:
; build_flags =
;   -D BMS_SDA_GPIO_NUM=16
;   -D BMS_SCL_GPIO_NUM=17
;   -D BMS_I2C_PORT_NUM=1
;   -D BMS_SCL_WAIT_US=12000
; Set BMS_ENABLE_INTERNAL_PULLUPS=1 only for a short diagnostic test after
; verifying that the BMS does not pull SDA/SCL above 3.3 V.
