; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200

; Default BMS wiring: SDA=GPIO21, SCL=GPIO22, I2C port 0.
; Override only after confirming your board wiring and safe 3.3-V logic levels:
build_flags =
  -D BMS_ENABLE_INTERNAL_PULLUPS=1
;   -D BMS_SDA_GPIO_NUM=16
;   -D BMS_SCL_GPIO_NUM=17
;   -D BMS_I2C_PORT_NUM=1
;   -D BMS_SCL_WAIT_US=12000
;   -D BMS_CLOCK_HZ=10000
;   -D BMS_USE_PEC=1
; Internal pull-ups are enabled because the BMS lines otherwise float low after
; an ESP32 reset. Keep them only with confirmed 3.3-V SMBus logic.
